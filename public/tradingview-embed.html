<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradingView Embed</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1520;
      }

      body {
        font-family: Arial, sans-serif;
      }

      .tradingview-widget-container,
      .tradingview-widget-container__widget {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="tradingview-widget-container">
      <div id="tv-widget" class="tradingview-widget-container__widget"></div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const symbol = params.get('tvwidgetsymbol') || 'NSE:NIFTY';
      const interval = params.get('interval') || 'D';
      const theme = params.get('theme') || 'dark';
      const locale = params.get('locale') || 'in';
      const timezone = params.get('timezone') || 'Asia/Kolkata';
      const backgroundColor = params.get('backgroundColor') || '#0f1520';
      const gridColor = params.get('gridColor') || 'rgba(255,255,255,0.06)';

      const script = document.createElement('script');
      script.src =
        'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
      script.type = 'text/javascript';
      script.async = true;
      script.innerHTML = JSON.stringify({
        autosize: true,
        symbol,
        interval,
        timezone,
        theme,
        style: '1',
        locale,
        backgroundColor,
        gridColor,
        withdateranges: true,
        hide_side_toolbar: false,
        hide_top_toolbar: false,
        allow_symbol_change: false,
        save_image: false,
        details: false,
        calendar: false,
        hotlist: false,
        support_host: 'https://www.tradingview.com',
      });

      document.querySelector('.tradingview-widget-container').appendChild(script);
    </script>
  </body>
</html>
